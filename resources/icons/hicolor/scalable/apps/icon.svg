<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Outer COSMIC squircle background gradient -->
    <linearGradient id="bgGrad" x1="16" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="48%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>

    <!-- Soft ambient radial mint light inside the squircle -->
    <radialGradient id="tileGlow" cx="28%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle top-left bevel highlight on squircle -->
    <linearGradient id="rimLight" x1="16" y1="10" x2="112" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.72"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.50"/>
    </linearGradient>

    <!-- Creamy mint disc base -->
    <radialGradient id="discBase" cx="44%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="68%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </radialGradient>

    <!-- Lush peppermint swirl stripe gradient -->
    <linearGradient id="swirlGrad" x1="64" y1="24" x2="104" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Deep emerald-teal center hub -->
    <linearGradient id="hubGrad" x1="50" y1="48" x2="78" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="55%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Soft diffused candy-glass sheen over upper-left of disc -->
    <radialGradient id="glossGrad" cx="34%" cy="28%" r="54%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Play button crisp highlight -->
    <linearGradient id="playGrad" x1="59" y1="53" x2="74" y2="75" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>

    <!-- Drop shadow filters -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.5" flood-color="#022c22" flood-opacity="0.42"/>
    </filter>
    <filter id="hubShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#022c22" flood-opacity="0.38"/>
    </filter>

    <!-- Clip inside the squircle tile -->
    <clipPath id="tileClip">
      <rect x="10" y="10" width="108" height="108" rx="26"/>
    </clipPath>

    <!-- Clip swirl arms cleanly inside the disc -->
    <clipPath id="discClip">
      <circle cx="64" cy="64" r="39.5"/>
    </clipPath>

    <!-- Single curved peppermint pinwheel arm -->
    <path id="swirlArm" d="M 64 64 C 73 50, 91 45, 105 61 A 41 41 0 0 1 101 83 C 89 67, 74 63, 64 64 Z"/>
  </defs>

  <!-- Subtle outer bottom depth shadow -->
  <rect x="11" y="13" width="106" height="106" rx="26" fill="#022c22" opacity="0.28"/>

  <!-- Main COSMIC squircle tile -->
  <g clip-path="url(#tileClip)">
    <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#bgGrad)"/>
    <rect x="10" y="10" width="108" height="108" rx="26" fill="url(#tileGlow)"/>
  </g>
  <rect x="10.75" y="10.75" width="106.5" height="106.5" rx="25.25" fill="none" stroke="url(#rimLight)" stroke-width="1.5"/>

  <!-- Peppermint vinyl disc -->
  <g filter="url(#softShadow)">
    <circle cx="64" cy="64" r="40" fill="url(#discBase)"/>
  </g>

  <!-- Six curved peppermint swirl arms -->
  <g clip-path="url(#discClip)">
    <use href="#swirlArm" fill="url(#swirlGrad)"/>
    <use href="#swirlArm" fill="url(#swirlGrad)" transform="rotate(60 64 64)"/>
    <use href="#swirlArm" fill="url(#swirlGrad)" transform="rotate(120 64 64)"/>
    <use href="#swirlArm" fill="url(#swirlGrad)" transform="rotate(180 64 64)"/>
    <use href="#swirlArm" fill="url(#swirlGrad)" transform="rotate(240 64 64)"/>
    <use href="#swirlArm" fill="url(#swirlGrad)" transform="rotate(300 64 64)"/>

    <!-- Subtle vinyl record grooves -->
    <circle cx="64" cy="64" r="35.5" fill="none" stroke="#064e3b" stroke-opacity="0.10" stroke-width="0.9"/>
    <circle cx="64" cy="64" r="31" fill="none" stroke="#064e3b" stroke-opacity="0.08" stroke-width="0.8"/>
    <circle cx="64" cy="64" r="26.5" fill="none" stroke="#064e3b" stroke-opacity="0.08" stroke-width="0.8"/>

    <!-- Soft diffused gloss over upper-left of disc -->
    <circle cx="64" cy="64" r="39.5" fill="url(#glossGrad)"/>
  </g>

  <!-- Crisp outer disc rim -->
  <circle cx="64" cy="64" r="39.5" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.4"/>

  <!-- Center vinyl hub & play emblem -->
  <g filter="url(#hubShadow)">
    <circle cx="64" cy="64" r="18.5" fill="#ecfdf5"/>
    <circle cx="64" cy="64" r="16.2" fill="url(#hubGrad)"/>
    <circle cx="64" cy="64" r="15.5" fill="none" stroke="#5eead4" stroke-opacity="0.35" stroke-width="1"/>
  </g>

  <!-- Rounded Play triangle (optically centered) -->
  <path
    d="M 61.1 55.8 C 59.8 55.0 58.7 55.7 58.7 57.2 L 58.7 70.8 C 58.7 72.3 59.8 73.0 61.1 72.2 L 72.9 65.4 C 74.2 64.6 74.2 63.4 72.9 62.6 Z"
    fill="url(#playGrad)"
  />
</svg>
