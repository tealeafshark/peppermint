<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Front peppermint leaf: crisp cool mint-aqua to vibrant peppermint emerald -->
    <linearGradient id="frontLeafGrad" x1="34" y1="14" x2="94" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="44%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Back companion mint leaf: slightly cooler, deeper spearmint-teal for natural depth -->
    <linearGradient id="backLeafGrad" x1="34" y1="16" x2="92" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="48%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <!-- Subtle half-leaf fold shading matching Nettle's sculptural style -->
    <linearGradient id="leafShade" x1="64" y1="14" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Stem gradient -->
    <linearGradient id="stemGrad" x1="60" y1="86" x2="48" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>

    <!-- Soft drop shadow matching Nettle so both icons float cleanly together -->
    <filter id="dropShadow" x="-18%" y="-14%" width="136%" height="136%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="3.2" flood-color="#022c22" flood-opacity="0.34"/>
    </filter>

    <!-- Gentle overlap shadow cast by front leaf onto companion leaf -->
    <filter id="overlapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2.5" dy="2" stdDeviation="2.6" flood-color="#022c22" flood-opacity="0.32"/>
    </filter>

    <!-- Classic plump ovate peppermint leaf silhouette (smooth curved margins, gentle pointed tip) -->
    <path
      id="mintLeaf"
      d="M 64 12
         C 52.5 22.5, 35 38.5, 35 58.5
         C 35 76, 47 88, 64 92
         C 81 88, 93 76, 93 58.5
         C 93 38.5, 75.5 22.5, 64 12 Z"
    />

    <clipPath id="mintClip">
      <use href="#mintLeaf"/>
    </clipPath>
  </defs>

  <g filter="url(#dropShadow)" transform="translate(2, -1)">
    <!-- Graceful curved shared stem -->
    <path
      d="M 60 88 Q 56 102.5 47.5 114"
      stroke="url(#stemGrad)"
      stroke-width="5.2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Smaller companion peppermint leaf tucked to the left -->
    <g transform="translate(55, 92) rotate(-37) scale(0.75) translate(-64, -92)">
      <use href="#mintLeaf" fill="url(#backLeafGrad)"/>
      <g clip-path="url(#mintClip)">
        <rect x="64" y="8" width="38" height="90" fill="url(#leafShade)"/>
        <!-- Midrib -->
        <path
          d="M 64 25 L 64 86.5"
          stroke="#ccfbf1"
          stroke-opacity="0.68"
          stroke-width="3.0"
          stroke-linecap="round"
          fill="none"
        />
        <!-- Curved lateral veins (ending cleanly with rounded caps inside margin) -->
        <g stroke="#ccfbf1" stroke-opacity="0.46" stroke-width="2.2" stroke-linecap="round" fill="none">
          <path d="M 64 46 Q 56 43 50.5 38"/>
          <path d="M 64 46 Q 72 43 77.5 38"/>
          <path d="M 64 66 Q 53 63 45.5 56.5"/>
          <path d="M 64 66 Q 75 63 82.5 56.5"/>
        </g>
      </g>
      <use
        href="#mintLeaf"
        fill="none"
        stroke="#064e3b"
        stroke-opacity="0.28"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
    </g>

    <!-- Primary front peppermint leaf angled gracefully to the upper-right -->
    <g filter="url(#overlapShadow)" transform="translate(60, 93) rotate(22) scale(1.06) translate(-64, -92)">
      <use href="#mintLeaf" fill="url(#frontLeafGrad)"/>
      <g clip-path="url(#mintClip)">
        <rect x="64" y="8" width="38" height="90" fill="url(#leafShade)"/>
        <!-- Midrib -->
        <path
          d="M 64 22.5 L 64 86.5"
          stroke="#ccfbf1"
          stroke-opacity="0.74"
          stroke-width="2.6"
          stroke-linecap="round"
          fill="none"
        />
        <!-- Curved lateral veins (ending cleanly with rounded caps inside margin) -->
        <g stroke="#ccfbf1" stroke-opacity="0.52" stroke-width="2.0" stroke-linecap="round" fill="none">
          <path d="M 64 41 Q 57 38.5 52.5 34"/>
          <path d="M 64 41 Q 71 38.5 75.5 34"/>
          <path d="M 64 58 Q 53.5 55 46 49"/>
          <path d="M 64 58 Q 74.5 55 82 49"/>
          <path d="M 64 74 Q 54 71.5 46.5 66"/>
          <path d="M 64 74 Q 74 71.5 81.5 66"/>
        </g>
      </g>
      <use
        href="#mintLeaf"
        fill="none"
        stroke="#064e3b"
        stroke-opacity="0.26"
        stroke-width="1.35"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
