[package]
name = "peppermint"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A fast, native local music player for COSMIC with multi-tab drag-and-drop playlists and a 10-band equalizer"
repository = "https://github.com/tealeafshark/peppermint"

[dependencies]
dirs = "6"
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
lofty = "0.22"
open = "5.3.2"
rand = "0.9"
rodio = { version = "0.20", default-features = false, features = [
    "symphonia-all",
] }
rust-embed = "8.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["full"] }
walkdir = "2"

[build-dependencies]
xdgen = "0.1"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = [
    "about",
    "dbus-config",
    "multi-window",
    "single-instance",
    "tokio",
    "wayland",
    "wgpu",
    "winit",
    "x11",
    "xdg-portal",
]
